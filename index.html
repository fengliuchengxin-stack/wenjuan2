const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playTone(freq, duration, type = 'sine', vol = 0.15) {
 if (audioCtx.state === 'suspended') audioCtx.resume();
 const osc = audioCtx.createOscillator();
 const gain = audioCtx.createGain();
 osc.type = type;
 osc.frequency.value = freq;
 gain.gain.setValueAtTime(vol, audioCtx.currentTime);
 gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
 osc.connect(gain);
 gain.connect(audioCtx.destination);
 osc.start();
 osc.stop(audioCtx.currentTime + duration);
}

function vibrate(pattern = 30) { if (navigator.vibrate) navigator.vibrate(pattern); }

/* ===== 节拍器背景音（根据题目自动调速） ===== */
let bgStarted = false;
let tickInterval = 1000;
let tickTimer = null;

function playMetronomeTick() {
 if (audioCtx.state === 'suspended') audioCtx.resume();
 const osc = audioCtx.createOscillator();
 const gain = audioCtx.createGain();
 osc.type = 'sine';
 osc.frequency.value = 1200;
 gain.gain.setValueAtTime(0.42, audioCtx.currentTime);
 gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
 osc.connect(gain);
 gain.connect(audioCtx.destination);
 osc.start();
 osc.stop(audioCtx.currentTime + 0.1);
}

function startBackgroundAudio() {
 if (bgStarted) return;
 bgStarted = true;
 if (audioCtx.state === 'suspended') audioCtx.resume();
 scheduleTick();
}

function scheduleTick() {
 if (tickTimer) clearTimeout(tickTimer);
 if (!bgStarted) return;
 playMetronomeTick();
 tickTimer = setTimeout(scheduleTick, tickInterval);
}

function updateMetronomeSpeed(q) {

function playerNameForFile() {
  let n = (answers[1] || '').toString().trim();
  if (!n) n = '匿名';
  return n.replace(/[\\/:*?"<>|]/g, '_').slice(0, 40);
}

function compressImage(file, maxSide, quality) {
  return new Promise(function(resolve, reject) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        let w = img.width, h = img.height;
        const scale = Math.min(1, maxSide / Math.max(w, h));
        w = Math.round(w * scale); h = Math.round(h * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function uploadToDrive(payload) {
  const raw = String(payload.base64 || '')
    .replace(/^data:.*?base64,/, '')
    .replace(/\s/g, '');
  const name = payload.name || (playerNameForFile() + '_' + Date.now() + '.jpg');
  const body = {
    secret: DRIVE_UPLOAD_SECRET,
    fileName: name,
    mimeType: payload.mimeType || 'image/jpeg',
    base64: raw
  };
  const res = await fetch(DRIVE_UPLOAD_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  });
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); } catch (e) { throw new Error('云盘返回异常'); }
  if (!data || !data.ok) throw new Error((data && data.error) || '上传失败');
  return data;
}

async function uploadImageForQ(qid, file, statusEl, previewEl) {
  if (!file || !file.type.startsWith('image/')) {
    if (statusEl) { statusEl.textContent = '请选择图片文件'; statusEl.className = 'status err'; }
    return;
  }
  if (statusEl) { statusEl.textContent = '压缩并上传中…'; statusEl.className = 'status'; }
  try {
    const dataUrl = await compressImage(file, 1280, 0.82);
    if (previewEl) {
      previewEl.innerHTML = '<img src="' + dataUrl + '" alt="预览">';
    }
    if (!mediaStore[qid]) mediaStore[qid] = { driveUrls: [] };
    mediaStore[qid].image = dataUrl;
    const fname = playerNameForFile() + '_q' + qid + '_' + Date.now() + '.jpg';
    const result = await uploadToDrive({ base64: dataUrl, name: fname, mimeType: 'image/jpeg' });
    mediaStore[qid].driveUrls.push(result.url || '');
    if (statusEl) { statusEl.textContent = '✓ 上传成功'; statusEl.className = 'status'; }
    try { localStorage.setItem('nvshen_media', JSON.stringify(Object.keys(mediaStore))); } catch(e) {}
    soundClick();
  } catch (e) {
    console.error(e);
    if (statusEl) { statusEl.textContent = '上传失败：' + (e.message || e); statusEl.className = 'status err'; }
    soundError();
  }
}

async function uploadVideoForQ(qid, file, statusEl) {
  if (!file || !file.type.startsWith('video/')) {
    if (statusEl) { statusEl.textContent = '请选择视频文件'; statusEl.className = 'status err'; }
    return;
  }
  if (file.size > 20 * 1024 * 1024) {
    if (statusEl) { statusEl.textContent = '视频请控制在 20MB 以内'; statusEl.className = 'status err'; }
    return;
  }
  if (statusEl) { statusEl.textContent = '视频上传中，请稍候…'; statusEl.className = 'status'; }
  try {
    const dataUrl = await new Promise(function(resolve, reject) {
      const r = new FileReader();
      r.onload = function() { resolve(r.result); };
      r.onerror = reject;
      r.readAsDataURL(file);
    });
    const ext = (file.name.split('.').pop() || 'mp4').toLowerCase();
    const fname = playerNameForFile() + '_q' + qid + '_' + Date.now() + '.' + ext;
    const result = await uploadToDrive({
      base64: dataUrl,
      name: fname,
      mimeType: file.type || 'video/mp4'
    });
    if (!mediaStore[qid]) mediaStore[qid] = { driveUrls: [] };
    mediaStore[qid].videoName = fname;
    mediaStore[qid].driveUrls.push(result.url || '');
    if (statusEl) { statusEl.textContent = '✓ 视频上传成功'; statusEl.className = 'status'; }
    soundClick();
  } catch (e) {
    console.error(e);
    if (statusEl) { statusEl.textContent = '视频上传失败：' + (e.message || e); statusEl.className = 'status err'; }
    soundError();
  }
}

  uploadImageForQ(qid, f, document.getElementById('status' + qid), document.getElementById('preview' + qid));
}
function onPickVideo(qid, input) {
  const f = input.files && input.files[0];
  if (!f) return;
  uploadVideoForQ(qid, f, document.getElementById('status' + qid));
}

async function uploadPdfToDrive(pdf) {
  try {
    const base64Data = pdf.output('base64');
    const fname = playerNameForFile() + '_女神洗脑档案_' + Date.now() + '.pdf';
    await uploadToDrive({ base64: base64Data, name: fname, mimeType: 'application/pdf' });
    showToast('PDF 已同步到云盘');
  } catch (e) {
    console.error('PDF 云盘上传失败', e);
    showToast('PDF 云盘上传失败（本地已下载）');
  }
}

function toggleDanmu() {
  danmuEnabled = !danmuEnabled;
  const btn = document.getElementById('danmuToggle');
  if (btn) {
    btn.textContent = danmuEnabled ? '弹幕：开' : '弹幕：关';
    btn.classList.toggle('on', danmuEnabled);
  }
  if (danmuEnabled) {
    spawnDanmu('弹幕已开启');
  }
}

function spawnDanmu(text) {
  if (!danmuEnabled) return;
  const layer = document.getElementById('danmuLayer');
  if (!layer || !text) return;
  const el = document.createElement('div');
  el.className = 'danmu-item';
  el.textContent = String(text).slice(0, 80);
  el.style.top = (8 + Math.random() * 70) + '%';
  el.style.animationDuration = (8 + Math.random() * 6) + 's';
  layer.appendChild(el);
  setTimeout(function() { el.remove(); }, 15000);
}

function render() {
 const q = questions[current];
 const area = document.getElementById('form-area');
 let html = `<div class="card active">`;
 html += `<div class="card-top"><button type="button" class="exit-btn" onclick="showExitModal()">退出</button></div>`;
 html += `<div class="q-title"><span>Q${q.id}.</span> ${q.title}</div>`;

 if (q.type === 'radio' || q.type === 'scale') {
 if (q.type === 'scale') {
 html += `<div class="scale">`;
 for (let i = 0; i <= 10; i++) {
 html += `<label data-value="${i}"><input type="radio" name="q${q.id}" value="${i}" ${answers[q.id] == i ? 'checked' : ''}><span>${i}</span></label>`;
 }
 html += `</div><p style="text-align:center;font-size:0.78rem;color:#777;margin-top:8px">0 = 无法接受　　10 = 疯狂热爱</p>`;
 } else {
 q.options.forEach(opt => {
 html += `<label data-value="${opt}"><input type="radio" name="q${q.id}" value="${opt}" ${answers[q.id] === opt ? 'checked' : ''}> ${opt}</label>`;
 });
 }
 } else if (q.type === 'checkbox') {
 q.options.forEach(opt => {
 const checked = (answers[q.id] || []).includes(opt) ? 'checked' : '';
 html += `<label data-value="${opt}"><input type="checkbox" name="q${q.id}" value="${opt}" ${checked}> ${opt}</label>`;
 });
 } else if (q.type === 'textarea') {
 html += `<textarea id="input">${answers[q.id] || ''}</textarea>`;
 } else {
 html += `<input type="text" id="input" value="${answers[q.id] || ''}" placeholder="请输入...">`;
 }

 if (q.type === 'text' || q.type === 'textarea') {
 html += mediaBarHTML(q.id);
 }

 html += `<div class="btn-row">`;
 if (current > 0) html += `<button class="btn-prev" onclick="prev()">上一题</button>`;
 if (current < total - 1) {
 html += `<button class="btn-next" onclick="next()">下一题</button>`;
 } else {
 html += `<button class="btn-submit" id="submitBtn" onclick="submit()">提交并生成档案</button>`;
 }
 html += `</div></div>`;

 area.innerHTML = html;
 updateProgress();
 updateMetronomeSpeed(q);

 if (q.type === 'radio' || q.type === 'scale') {
 area.querySelectorAll('label[data-value]').forEach(label => {
 label.onclick = function() {

 answers[q.id] = value;
 localStorage.setItem('nvshen_answers', JSON.stringify(answers));
 area.querySelectorAll(`input[name="q${q.id}"]`).forEach(r => r.checked = (r.value == value));
 soundClick();
 vibrate(25);
 };
 });
 }

 if (q.type === 'checkbox') {
 area.querySelectorAll(`input[name="q${q.id}"]`).forEach(cb => {
 cb.addEventListener('change', function() {

 area.querySelectorAll(`input[name="q${q.id}"]:checked`).forEach(c => checkedValues.push(c.value));
 answers[q.id] = checkedValues;
 localStorage.setItem('nvshen_answers', JSON.stringify(answers));
 soundClick();
 vibrate(20);
 });
 });
 }

function next() {
 const q = questions[current];
 let currentAnswer = answers[q.id];

 if (q.type === 'radio' || q.type === 'scale') {
 const checked = document.querySelector(`input[name="q${q.id}"]:checked`);
 if (checked) currentAnswer = checked.value;
 } else if (q.type === 'checkbox') {
 const checkedValues = [];
 document.querySelectorAll(`input[name="q${q.id}"]:checked`).forEach(cb => checkedValues.push(cb.value));
 currentAnswer = checkedValues;
 } else {
 const el = document.getElementById('input');
 if (el) currentAnswer = el.value.trim();
 }

 answers[q.id] = currentAnswer;
 localStorage.setItem('nvshen_answers', JSON.stringify(answers));

 let isEmpty = false;
 if (q.type === 'checkbox') {
 isEmpty = !currentAnswer || !Array.isArray(currentAnswer) || currentAnswer.length === 0;
 } else {
 isEmpty = currentAnswer === '' || currentAnswer === null || currentAnswer === undefined;
 }

 if (isEmpty) {
 soundError();
 vibrate([40, 30, 40]);
 showToast('不许空着，老实回答');
 return;
 }

 soundNext();
 vibrate(35);
 current++;
 try {
 localStorage.setItem('nvshen_answers', JSON.stringify(answers));
 localStorage.setItem('nvshen_progress', String(current));
 } catch (e) {}
 render();
 showToast();
 window.scrollTo({ top: 0, behavior: 'smooth' });
}

function prev() {

 render();
 window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggleChat() {
 const p = document.getElementById('chatPanel');
 p.classList.toggle('collapsed');
 const h = document.getElementById('chatToggleHint');
 if (h) h.textContent = p.classList.contains('collapsed') ? '展开' : '收起';
}
function escapeHtml(s) {
 return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function formatChatTime(ts) {
 try {
 const d = ts && ts.toDate ? ts.toDate() : new Date(ts);
 return d.toLocaleString();
 } catch(e) { return ''; }
}
function renderChatList(docs) {
 const body = document.getElementById('chatBody');
 if (!body) return;
 if (!docs.length) {
 body.innerHTML = '<div class="chat-empty">还没有留言，来做第一个</div>';
 return;
 }
 body.innerHTML = docs.map(function(doc) {
 const d = doc.data();
 return '<div class="chat-msg"><div class="meta"><span class="name">' +
 escapeHtml(d.name || '匿名母畜') + '</span> · ' + formatChatTime(d.createdAt) +
 '</div><div>' + escapeHtml(d.text || '') + '</div></div>';
 }).join('');
 body.scrollTop = body.scrollHeight;
}
function startChatListener() {
 const body = document.getElementById('chatBody');
 if (!db) {
 if (body) body.innerHTML = '<div class="chat-empty">留言板未连接：请先在 Firebase 创建 Firestore 数据库</div>';
 return;
 }
 if (body) body.innerHTML = '<div class="chat-empty">加载中…</div>';
 db.collection('guestbook').limit(50)
 .onSnapshot(function(snap) {
 const docs = [];
 snap.forEach(function(doc) { docs.push(doc); });
 docs.sort(function(a, b) {
 const ta = (a.data().createdAt && a.data().createdAt.toMillis) ? a.data().createdAt.toMillis() : 0;
 const tb = (b.data().createdAt && b.data().createdAt.toMillis) ? b.data().createdAt.toMillis() : 0;
 return ta - tb;
 });
 renderChatList(docs);
      if (danmuEnabled && docs.length) {
        const last = docs[docs.length - 1].data();
        if (last && last.text) spawnDanmu((last.name || '匿名') + '：' + last.text);
      }
 }, function(err) {
 console.error(err);
 if (body) body.innerHTML = '<div class="chat-empty">读取失败：' + (err.code || '') + ' ' + (err.message || '请检查 Firestore 是否已创建并发布规则') + '</div>';
 });
}
async function sendChat() {
 if (!db) { showToast('留言板未连接'); return; }
 const nickEl = document.getElementById('chatNick');
 const textEl = document.getElementById('chatText');
 const nick = (nickEl && nickEl.value || '').trim().slice(0, 20);
 const text = (textEl && textEl.value || '').trim().slice(0, 200);
 if (!text) { showToast('写点什么再发'); soundError(); return; }
 const btn = document.querySelector('.chat-input-row button');
 if (btn) { btn.disabled = true; btn.textContent = '发送中…'; }
 try {
 await Promise.race([
 db.collection('guestbook').add({
 name: nick || '匿名母畜',
 text: text,
 createdAt: firebase.firestore.FieldValue.serverTimestamp()
 }),
 new Promise(function(_, reject) {
 setTimeout(function(){ reject(new Error('超时：请确认已创建 Firestore 并发布规则')); }, 15000);
 })
 ]);
 if (textEl) textEl.value = '';
 showToast('留言已发送');
 spawnDanmu((nick || '匿名母畜') + '：' + text);
 soundClick();
 } catch (e) {
 console.error(e);
 showToast('发送失败：' + (e.message || e.code || '检查 Firestore 规则'));
 soundError();
 } finally {
 if (btn) { btn.disabled = false; btn.textContent = '发送留言'; }
 }
}
function bootChat() {
 if (!document.getElementById('chatBody')) {
 setTimeout(bootChat, 50);
 return;
 }
 startChatListener();
}
if (document.readyState === 'loading') {
 document.addEventListener('DOMContentLoaded', bootChat);
} else {
 bootChat();
}

try {

render();
